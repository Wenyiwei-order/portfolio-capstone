# Build settings
[build]
  command = "npm install && cd client && npm install && npm run build"
  publish = "client/dist"
  functions = "server/api"

# Redirect API requests to Netlify Function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index"
  status = 200

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
