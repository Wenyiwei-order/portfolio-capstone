# Build settings
[build]
  command = "cd client && npm install && npm run build"
  publish = "client/dist"
  functions = "server/api"

# Redirect all API requests to serverless function
[[redirects]]
  from = "/api/*"
  to = "/api/index"
  status = 200

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
